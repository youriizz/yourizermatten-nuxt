name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Debug — env
        run: |
          echo "Node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "pwd: $(pwd)"
          ls -la

      - name: Install dependencies
        run: npm install

      - name: Debug — after install
        run: |
          echo "node_modules exists? $(ls node_modules | wc -l) packages"
          echo "nuxt bin: $(./node_modules/.bin/nuxt --version 2>&1 || echo MISSING)"

      - name: Build
        run: npm run build
        env:
          NUXT_APP_BASE_URL: /yourizermatten-nuxt/
          NUXT_PUBLIC_CONTENT_API_BASE_URL: /yourizermatten-nuxt/_content

      - name: Debug — list output
        run: |
          echo "=== .output/public exists? ==="
          ls -la .output/public || echo "MISSING"
          echo "=== HTML files ==="
          find .output/public -name "*.html" | sort || echo "none"
          echo "=== Root index.html size ==="
          wc -c .output/public/index.html || echo "no index.html"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
